name: Sync upstream

# Keeps `devin` (this fork's changes) rebased onto pingdotgg/t3code main.
# Runs daily and on demand. A rebase conflict fails the run so a human (or
# Devin) can resolve it by hand.
#
# The fork does not carry upstream's workflows. They are upstream's releases,
# deploys, and PR automation, need upstream's secrets and runners, and any
# change under .github/workflows/ makes GitHub reject pushes made with the
# default GITHUB_TOKEN. So after each rebase the workflow directory is reset
# to the fork's own files in a single trailing commit. That commit is removed
# before the next rebase and recreated after it, so upstream edits to those
# files never conflict, the workflow directory never changes between pushes,
# and no personal access token is needed.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  STRIP_SUBJECT: "ci(fork): drop upstream workflows"
  KEEP_WORKFLOWS: "release-fork.yml sync-upstream.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devin
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main

      - name: Remove the previous workflow-strip commit
        run: |
          strip=$(git log --format='%H %s' upstream/main..HEAD | awk -v s="$STRIP_SUBJECT" 'substr($0, index($0, " ") + 1) == s { print $1; exit }')
          if [ -n "$strip" ]; then
            git rebase --onto "$strip^" "$strip"
          fi

      - name: Rebase devin onto upstream
        run: |
          if ! git rebase upstream/main; then
            git rebase --abort
            {
              echo 'Could not cleanly rebase `devin` onto upstream/main. Rebase manually:'
              echo
              echo '```bash'
              echo 'git fetch upstream main'
              echo 'git checkout devin'
              echo 'git rebase upstream/main   # resolve conflicts'
              echo 'git push --force-with-lease origin devin'
              echo '```'
              echo
              echo 'The trailing "drop upstream workflows" commit is recreated by the next sync run.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::devin does not rebase cleanly onto upstream/main; see the job summary"
            exit 1
          fi

      - name: Keep only the fork's workflows
        run: |
          for path in .github/workflows/*; do
            name=$(basename "$path")
            case " $KEEP_WORKFLOWS " in *" $name "*) continue ;; esac
            git rm -q "$path"
          done
          if ! git diff --cached --quiet; then
            git commit -q -m "$STRIP_SUBJECT"
          fi

      - name: Push
        run: git push --force-with-lease origin devin
