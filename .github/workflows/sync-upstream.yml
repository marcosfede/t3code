name: Sync upstream

# Keeps this fork in sync with pingdotgg/t3code:
#  - fast-forwards `main` to upstream/main (pristine mirror, never diverges)
#  - rebases `devin` (this fork's changes) onto the new main
# Runs daily and on demand. If the rebase hits a conflict it opens an issue
# instead of pushing, so a human (or Devin) can resolve it.
#
# Requires the SYNC_UPSTREAM_TOKEN repo secret: a PAT with contents+workflows
# write access. The default GITHUB_TOKEN cannot push commits that touch
# .github/workflows/, so upstream workflow changes would fail the sync.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devin
          fetch-depth: 0
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward main to upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main
          git push origin upstream/main:refs/heads/main

      - name: Rebase devin onto main
        id: rebase
        run: |
          if git rebase upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push rebased branch
        if: steps.rebase.outputs.conflict == 'false'
        run: git push --force-with-lease origin devin

      - name: Report conflict
        if: steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream sync conflict: devin needs a manual rebase"
          {
            echo 'The scheduled upstream sync fast-forwarded `main` but could not cleanly rebase `devin` onto it. Rebase manually:'
            echo
            echo '```bash'
            echo 'git fetch origin'
            echo 'git checkout devin'
            echo 'git rebase origin/main'
            echo '# resolve conflicts'
            echo 'git push --force-with-lease origin devin'
            echo '```'
          } > /tmp/issue-body.md
          cat /tmp/issue-body.md >> "$GITHUB_STEP_SUMMARY"
          # Issues may be disabled on this fork; the failed run is the signal then.
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty' || true)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file /tmp/issue-body.md || true
          fi
          exit 1
