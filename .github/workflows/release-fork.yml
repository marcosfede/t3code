name: Release (fork)

# Slimmed-down fork variant of release.yml: builds unsigned desktop artifacts
# for Linux x64 and macOS arm64 on standard GitHub runners and publishes them
# to a GitHub Release on this fork. No Apple notarization, no Windows/Azure
# signing, no Cloudflare/Vercel/npm publishing. The electron-updater feed
# resolves to this repository's releases via GITHUB_REPOSITORY, so packaged
# builds auto-update from the fork's own releases.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.3 — becomes tag v1.2.3 on this fork)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-fork
  cancel-in-progress: false

jobs:
  resolve_version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        shell: bash
        env:
          RAW_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RAW_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: resolve_version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve_version.outputs.version }}"

      - name: Build desktop artifact (unsigned)
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.resolve_version.outputs.version }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          ls -la release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [resolve_version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: assets
          merge-multiple: true

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve_version.outputs.tag }}
          VERSION: ${{ needs.resolve_version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "T3 Code (fork) v$VERSION" \
            --notes "Unsigned fork build (Linux x64 AppImage, macOS arm64 dmg). macOS: right-click → Open, or run \`xattr -d com.apple.quarantine\` on the app." \
            assets/*
