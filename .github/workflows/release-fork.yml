name: Release (fork)

# Slimmed-down fork variant of release.yml: builds unsigned Linux x64 and
# self-signed macOS arm64 artifacts on standard GitHub runners and publishes
# them to a GitHub Release on this fork. No Apple notarization, no Windows/Azure
# signing, no Cloudflare/Vercel/npm publishing. The electron-updater feed
# resolves to this repository's releases via GITHUB_REPOSITORY, so packaged
# builds auto-update from the fork's own releases.

on:
  push:
    branches: [devin]
  workflow_run:
    workflows: [Sync upstream]
    types: [completed]
    branches: [devin]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (for example 0.0.40-fork.3); defaults to the next fork revision"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fork-delivery
  queue: max

jobs:
  resolve_version:
    name: Resolve version
    if: github.ref == 'refs/heads/devin' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      should_build: ${{ steps.meta.outputs.should_build }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'devin' || github.sha }}
          fetch-depth: 0
      - id: meta
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" origin/devin; then
            echo "Skipping $sha because it was superseded by a rebase." >> "$GITHUB_STEP_SUMMARY"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(node -p 'require("./apps/desktop/package.json").version')
          if [[ ! "$base" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid desktop base version: $base" >&2
            exit 1
          fi
          max=0
          while IFS= read -r tag; do
            revision="${tag#"v${base}-fork."}"
            if [[ "$revision" =~ ^[1-9][0-9]*$ ]] && (( revision > max )); then
              max=$revision
            fi
          done < <(git tag --list "v${base}-fork.*")
          version="${RAW_VERSION#v}"
          version="${version:-${base}-fork.$((max + 1))}"
          revision="${version#"${base}-fork."}"
          if [[ "$version" != "${base}-fork.${revision}" || ! "$revision" =~ ^[1-9][0-9]*$ ]] || (( revision <= max )); then
            echo "Version must be ${base}-fork.N with N greater than $max: $version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=$sha"
            echo "should_build=true"
          } >> "$GITHUB_OUTPUT"
          echo "Building v$version from $sha" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.label }}
    needs: resolve_version
    if: needs.resolve_version.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_version.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Import macOS fork signing identity
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MAC_CSC_LINK:?Set MAC_CSC_LINK to the base64-encoded persistent signing .p12}"
          : "${MAC_CSC_KEY_PASSWORD:?Set MAC_CSC_KEY_PASSWORD to the .p12 password}"
          umask 077
          keychain="$RUNNER_TEMP/t3-fork-signing.keychain-db"
          p12="$RUNNER_TEMP/t3-fork-signing.p12"
          cert="$RUNNER_TEMP/t3-fork-signing.pem"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$p12"
          /usr/bin/openssl pkcs12 -in "$p12" -clcerts -nokeys -out "$cert" -passin env:MAC_CSC_KEY_PASSWORD
          fingerprint=$(/usr/bin/openssl x509 -in "$cert" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
          [[ "$fingerprint" =~ ^[0-9A-F]{40}$ ]]
          security create-keychain -p "$MAC_CSC_KEY_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MAC_CSC_KEY_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security import "$p12" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_CSC_KEY_PASSWORD" "$keychain" >/dev/null
          security find-identity -v -p codesigning "$keychain"
          cp /usr/bin/true "$RUNNER_TEMP/t3-fork-signing-probe"
          codesign --force --sign "$fingerprint" --keychain "$keychain" --timestamp=none "$RUNNER_TEMP/t3-fork-signing-probe"
          codesign --verify --strict -R="anchor H\"$fingerprint\"" "$RUNNER_TEMP/t3-fork-signing-probe"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "T3CODE_MACOS_SELF_SIGN_IDENTITY=$fingerprint" >> "$GITHUB_ENV"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux build prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get install -y imagemagick
          fi

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve_version.outputs.version }}"

      - name: Build desktop artifact
        shell: bash
        run: |
          signing_args=()
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            signing_args+=(--signed)
          fi
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.resolve_version.outputs.version }}" \
            "${signing_args[@]}" \
            --verbose

      - name: Verify macOS update signature
        if: matrix.platform == 'mac'
        shell: bash
        env:
          VERSION: ${{ needs.resolve_version.outputs.version }}
        run: |
          set -euo pipefail
          ditto -x -k "release/T3-Code-${VERSION}-arm64.zip" "$RUNNER_TEMP/t3-fork-update"
          apps=("$RUNNER_TEMP/t3-fork-update/"*.app)
          [[ ${#apps[@]} -eq 1 && -d "${apps[0]}" ]]
          app="${apps[0]}"
          codesign --verify --deep --strict "$app"
          codesign --verify -R="anchor H\"$T3CODE_MACOS_SELF_SIGN_IDENTITY\" and identifier \"com.t3tools.t3code\"" "$app"
          codesign --display --requirements - "$app"

      - name: Remove macOS signing keychain
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/t3-fork-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/t3-fork-signing.p12" "$RUNNER_TEMP/t3-fork-signing.pem" "$RUNNER_TEMP/t3-fork-signing-probe"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          ls -la release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [resolve_version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: assets
          merge-multiple: true

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve_version.outputs.tag }}
          VERSION: ${{ needs.resolve_version.outputs.version }}
          RELEASE_SHA: ${{ needs.resolve_version.outputs.sha }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/devin" --jq .object.sha)
          latest=false
          if [[ "$tip" == "$RELEASE_SHA" ]]; then
            latest=true
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --latest="$latest" \
            --title "T3 Code (fork) $VERSION (${RELEASE_SHA:0:9})" \
            --notes "Built from \`$RELEASE_SHA\` on \`devin\`. Fork build (unsigned Linux x64 AppImage, self-signed macOS arm64 dmg). In-product updates are available after installing a recent self-signed fork release and approving its certificate. Not Apple-notarized: initial installation may require a Gatekeeper override." \
            assets/*
